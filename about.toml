# cargo-about configuration. package.yml generates THIRD_PARTY_LICENSES.html
# from it for the distributed binary (see spec/development.md); the output is
# not committed.
#
# `accepted` repeats `allow` in deny.toml (D042): cargo-deny rejects a license
# in CI, cargo-about needs it here to be able to print it. Change both together.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what the binary links: no dev- or build-dependencies.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# The workspace's own crates are covered by LICENSE and THIRD_PARTY_NOTICES.md.
private = { ignore = true }
# The platforms packaged by package.yml, so that platform-specific
# dependencies of each are listed.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
