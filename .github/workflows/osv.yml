name: OSV advisories

# Weekly OSV scan of Cargo.lock and vendor/gpui/Cargo.lock (the separate GPUI
# workspace that CI builds its unit tests from; #813). cargo-deny reads only the RustSec database;
# OSV also carries GitHub advisories (GHSA) that RustSec lacks, such as the
# one for grid (#726). A new advisory can appear without any change here, so
# this runs on a schedule and by hand. It is not a pull request check: a
# finding in a transitive GPUI dependency would block unrelated changes.
# Triage findings in spec/development.md, "Dependency advisories". The scan
# fails on every reported finding, and the GPUI tree always carries a few
# accepted unmaintained and unsound notices, so the accepted ones are listed
# with reasons in osv-scanner.toml (passed with `--config`), the way
# cargo-deny's accepted advisories go in deny.toml; a failure then means a
# new finding.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV scan of Cargo.lock files
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Cargo.lock files
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=vendor/gpui/Cargo.lock
            --config=osv-scanner.toml
