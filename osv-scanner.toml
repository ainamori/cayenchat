# osv-scanner configuration for the weekly "OSV advisories" scan
# (.github/workflows/osv.yml, run with `--config=osv-scanner.toml`).
#
# osv-scanner exits non-zero on every reported finding, including the
# unmaintained and unsound (informational) RUSTSEC notices that arrive
# through GPUI and can only be fixed by an upstream update. Accepted
# findings are listed here with a reason, the way cargo-deny's accepted
# advisories are listed in deny.toml, so the job fails only when a new
# finding appears. Re-evaluate an entry when the dependency path, an
# enabled feature or a version changes, or when the advisory's text
# changes; the full triage of 2026-11-18 is in spec/development.md,
# "Dependency advisories".

# grid 0.18 (GHSA-38c5-483c-4qqp, integer overflow in Grid::expand_rows):
# pinned by taffy 0.9, which GPUI pins. CayenChat's UI uses no CSS-grid
# layout and its sizes are small and fixed, so the overflow cannot be
# triggered; it needs a GPUI/taffy update.
[[IgnoredVulns]]
id = "GHSA-38c5-483c-4qqp"
reason = "grid 0.18 is pinned by taffy 0.9 (GPUI); no CSS-grid layout is used, so the overflow is unreachable. Re-evaluate on a GPUI/taffy update."

# git2 0.20 (RUSTSEC-2026-0183, potential UB in Remote::list on a remote
# that advertises no refs): comes through gpui_util for its test support
# alone; the app never calls Remote::list or blame_buffer. Updating needs
# git2 0.21 from gpui_util.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0183"
reason = "git2 0.20 comes through gpui_util test support only; the app never calls Remote::list. Updating needs git2 0.21 from gpui_util."

# git2 0.20 (RUSTSEC-2026-0184, potential UB in a Signature from a
# buffer-created BlameHunk): same reachability as RUSTSEC-2026-0183.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0184"
reason = "Same reachability as RUSTSEC-2026-0183: gpui_util test support only, blame_buffer never called."

# async-std is discontinued (RUSTSEC-2025-0052). It is a transitive
# dependency through GPUI; nothing here can replace it.
[[IgnoredVulns]]
id = "RUSTSEC-2025-0052"
reason = "Unmaintained notice, transitive through GPUI; accepted until GPUI moves."

